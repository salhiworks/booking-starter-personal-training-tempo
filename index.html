<!doctype html>
<html lang="en-US" data-headings="bold">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ballast Strength Studio — private personal training in Fremont, Seattle</title>
    <meta name="description" content="Private strength and movement coaching in Fremont, Seattle — one-to-one or with a training partner. Beginners welcome. See sessions and prices and book online." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ballast Strength Studio — private personal training in Fremont, Seattle" />
    <meta property="og:description" content="Private strength and movement coaching in Fremont, Seattle — one-to-one or with a training partner. Beginners welcome. See sessions and prices and book online." />
    <meta name="theme-color" content="#f2f1ee" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The hero photo (the default in src/content/site.ts) and its phone crop; sizes must match HERO_SIZES / PHONE_CROP in src/components/Hero.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 960px)"
      imagesrcset="/photos/hero-stepup-800.avif 800w, /photos/hero-stepup-1200.avif 1200w, /photos/hero-stepup-1600.avif 1600w"
      imagesizes="32vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-width: 959px)"
      imagesrcset="/photos/hero-wide-480.avif 480w, /photos/hero-wide-800.avif 800w, /photos/hero-wide-1200.avif 1200w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
